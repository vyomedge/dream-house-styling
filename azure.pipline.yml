  # -----------------------------------
  # PROD DEPLOY
  # -----------------------------------
  - stage: Prod
    displayName: "Deploy to Production"

    jobs:
      - job: DeployProd
        displayName: "Deploy to Hostinger - Prod"

        variables:
          imageName: "dreamhousestyling/dhs-frontend"
          dockerRegistry: "docker.io"
          dockerRegistryServiceConnection: "DockerHubConnection"
          buildVersion: $[counter('build-version', 1)]

        steps:
          - task: Docker@2
            displayName: "Login to Docker Hub"
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - powershell: |
              $image = "$(dockerRegistry)/$(imageName):latest"
              $backupTag = "$(dockerRegistry)/$(imageName):build-$(buildVersion)"

              docker pull $image
              if ($LASTEXITCODE -eq 0) {
                  docker tag $image $backupTag
                  docker push $backupTag
              }
            displayName: "Backup previous latest Docker image"

          - task: Docker@2
            displayName: "Build and Push Docker Image"
            inputs:
              command: buildAndPush
              repository: $(imageName)
              dockerfile: Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                latest

          - script: |
              curl -X POST http://72.61.174.48:9000/hooks/deploy-dhs-frontend?token=secretdhsfrontend5476
            displayName: "Trigger Deploy on VPS"
